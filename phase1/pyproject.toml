
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rumor-graph"
version = "0.1.0"
description = "Graph-based misinformation detection research"
requires-python = ">=3.11"

dependencies = [
    "torch",
    "torch-geometric",
    "numpy",
    "pandas",
    "scikit-learn",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
